    <path id="marco_base" d="M76 0H1258l76 77v247l-76 77H76L0 324V77z" fill="#0a0705" stroke="#21150d" stroke-width="4"/>
    <path d="M80 7H1254l70 71v245l-70 71H80L10 323V78z M93 27L31 90v220l62 63h1148l62-63V90l-62-63z" fill="url(#iron)" fill-rule="evenodd" stroke="#4b3423" stroke-width="3"/>
    <path d="M94 27h1147l62 63v220l-62 63H94l-63-63V90z M108 43L48 103v194l60 60h1119l59-60V103l-59-60z" fill="url(#ironHi)" fill-rule="evenodd" stroke="#0c0805" stroke-width="4"/>
    <path d="M109 45h1117l58 59v192l-58 59H109l-58-59V104z M121 59L66 114v172l55 55h1093l55-55V114l-55-55z" fill="#130d08" fill-rule="evenodd"/>
    <path d="M121 59h1093l55 55v172l-55 55H121l-55-55V114z M133 72L81 124v152l52 52h1069l52-52V124l-52-52z" fill="url(#gold)" fill-rule="evenodd" stroke="#6e3d14" stroke-width="3"/>
    <path d="M132 73h1070l50 51v152l-50 51H132l-50-51V124z" fill="#6b3514" stroke="#efbe70" stroke-width="3"/>

    <!-- pergamino -->
    <path id="pergamino" d="M106 55H1228l35 36v219l-35 36H106l-35-36V91z" fill="url(#paper)" stroke="#6e3e1c" stroke-width="5"/>
    <path d="M109 61h1116l31 32v214l-31 32H109l-31-32V93z" fill="url(#paperGlow)" stroke="#ffe5ad" stroke-width="2"/>
    <path d="M110 66h1114" fill="none" stroke="#fff1c7" stroke-width="4" stroke-linecap="round" opacity=".78"/>
    <path d="M108 335h1118" fill="none" stroke="#9e612d" stroke-width="4" opacity=".45"/>

