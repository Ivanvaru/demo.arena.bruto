    <g clip-path="url(#paperClip)" fill="none" stroke-linecap="round">
      <path d="M153 88c68-18 119 18 183-2s139 12 211-3 138 7 201-2 142 17 220-2 149 17 231-1" stroke="#fff0c7" stroke-width="5" opacity=".18"/>
      <path d="M105 124c54 18 78-12 133 2s105-10 159 4 114-5 166 1 92-9 149 3 102-8 158 1 110-14 177-1 107-6 170 6" stroke="#bd7c39" stroke-width="8" opacity=".09"/>
      <path d="M91 278c76-15 113 14 181-1s118 12 184 0 116 12 183-2 125 13 196-1 125 14 192 0 123 10 208-3" stroke="#9b5c29" stroke-width="12" opacity=".07"/>
      <path d="M180 98c-25 43 15 62-14 105s13 76-9 112M396 77c21 39-10 70 16 105s-10 83 13 139M663 80c-24 36 15 62-12 102s12 77-8 125M918 76c24 42-12 75 16 111s-11 76 10 126M1136 91c-20 34 11 66-13 99s13 79-7 112" stroke="#b37234" stroke-width="8" opacity=".055"/>
      <path d="M268 171c48-19 99 11 142-8M732 244c69 20 113-15 180 2M1011 150c52-18 91 13 139-3M470 286c48-16 88 11 142-3" stroke="#7f481f" stroke-width="6" opacity=".06"/>
      <path d="M298 83l9 8 12-7 11 6M583 332l12-8 10 9 13-8M899 65l11 8 13-7M1074 337l9-9 13 7" stroke="#7b431d" stroke-width="3" opacity=".35"/>
      <circle cx="205" cy="245" r="38" fill="#a9672c" opacity=".045"/><circle cx="535" cy="135" r="52" fill="#9c5925" opacity=".04"/><circle cx="793" cy="283" r="47" fill="#9a5723" opacity=".04"/><circle cx="1080" cy="204" r="62" fill="#9b5926" opacity=".045"/>
    </g>

    <!-- tornillos -->
    <g id="tornillos" stroke="#2c190d" stroke-width="3">
      <circle cx="111" cy="98" r="11" fill="url(#rivet)"/><circle cx="111" cy="301" r="11" fill="url(#rivet)"/>
      <circle cx="1223" cy="98" r="11" fill="url(#rivet)"/><circle cx="1223" cy="301" r="11" fill="url(#rivet)"/>
      <g fill="#fff0c5" stroke="none" opacity=".62"><circle cx="108" cy="94" r="2.3"/><circle cx="108" cy="297" r="2.3"/><circle cx="1220" cy="94" r="2.3"/><circle cx="1220" cy="297" r="2.3"/></g>
    </g>

    <!-- juntas del marco -->
    <g id="juntas" fill="none" stroke-linecap="round">
      <path d="M176 5l-14 22 13 16M1158 5l15 22-14 16M176 396l-14-23 13-16M1158 396l15-23-14-16" stroke="#090604" stroke-width="6"/>
      <path d="M176 8l-10 18 10 13M1158 8l11 18-10 13M176 393l-10-18 10-14M1158 393l11-18-10-14" stroke="#9a7655" stroke-width="2" opacity=".65"/>
      <path d="M7 201h41M1286 201h41" stroke="#080503" stroke-width="7"/><path d="M12 197h34M1288 197h34" stroke="#8c684a" stroke-width="2" opacity=".7"/>
      <path d="M94 20c180 10 334-7 522 1s351-8 625 2M95 381c201-9 382 7 557-1s347 8 589-2" stroke="#b28a68" stroke-width="2" opacity=".35"/>
      <path d="M258 16l12 5m152-6l19 6m324-5l14 5m251-5l17 6M295 383l19-5m318 7l17-6m282 5l15-6" stroke="#d0ad86" stroke-width="2" opacity=".38"/>
    </g>
  </g>
</svg>
